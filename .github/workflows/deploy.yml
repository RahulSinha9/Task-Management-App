name: arm-task CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 773802564338.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend deps
        working-directory: ./Backend
        run: npm ci

      - name: Lint backend
        working-directory: ./Backend
        run: npm run lint --if-present || true

      - name: Install frontend deps
        working-directory: ./Frontend
        run: npm ci

      - name: Lint frontend
        working-directory: ./Frontend
        run: npm run lint --if-present || true

      - name: Build frontend validation
        working-directory: ./Frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:4000/api/v1

  build:
    name: Build and Push to ECR
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        run: |
          IMAGE="$ECR_REGISTRY/arm-task-backend:${{ steps.tag.outputs.tag }}"
          docker build -t "$IMAGE" ./Backend
          docker push "$IMAGE"
          docker tag "$IMAGE" "$ECR_REGISTRY/arm-task-backend:${{ github.ref_name }}-latest"
          docker push "$ECR_REGISTRY/arm-task-backend:${{ github.ref_name }}-latest"

      - name: Build and push frontend
        run: |
          IMAGE="$ECR_REGISTRY/arm-task-frontend:${{ steps.tag.outputs.tag }}"
          VITE_URL="https://staging-arm-task.devopslabx.com/api/v1"
          if [ "${{ github.ref_name }}" = "main" ]; then
            VITE_URL="https://arm-task.devopslabx.com/api/v1"
          fi
          docker build --build-arg VITE_API_BASE_URL="$VITE_URL" -t "$IMAGE" ./Frontend
          docker push "$IMAGE"
          docker tag "$IMAGE" "$ECR_REGISTRY/arm-task-frontend:${{ github.ref_name }}-latest"
          docker push "$ECR_REGISTRY/arm-task-frontend:${{ github.ref_name }}-latest"

  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    environment:
      name: staging
      url: http://10.0.2.179:3000

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bootstrap and deploy to staging
        run: |
          aws ssm send-command \
            --instance-ids "i-0155b67642e886865" \
            --document-name "AWS-RunShellScript" \
            --region ${{ env.AWS_REGION }} \
            --timeout-seconds 600 \
            --parameters 'commands=[
              "apt-get update -qq && apt-get install -y docker.io docker-compose-v2 curl jq unzip -qq || true",
              "systemctl enable docker && systemctl start docker || true",
              "curl -s https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip && unzip -o /tmp/awscliv2.zip -d /tmp && /tmp/aws/install --update || true",
              "mkdir -p /opt/arm-task",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 773802564338.dkr.ecr.ap-south-1.amazonaws.com",
              "cd /opt/arm-task && aws secretsmanager get-secret-value --secret-id arm-task/prod --region ap-south-1 --query SecretString --output text | jq -r \"to_entries | map(\\"\\(.key)=\\(.value)\\") | .[]\" > .env",
              "echo IMAGE_TAG=${{ needs.build.outputs.image_tag }} >> /opt/arm-task/.env",
              "echo ECR_REGISTRY=773802564338.dkr.ecr.ap-south-1.amazonaws.com >> /opt/arm-task/.env",
              "curl -s https://raw.githubusercontent.com/RahulSinha9/Task-Management-App/staging/docker-compose.yml -o /opt/arm-task/docker-compose.yml",
              "cd /opt/arm-task && docker compose -f docker-compose.yml pull",
              "cd /opt/arm-task && docker compose -f docker-compose.yml up -d --remove-orphans",
              "sleep 20 && docker compose -f /opt/arm-task/docker-compose.yml ps"
            ]' \
            --output text

      - name: Wait for deployment
        run: sleep 90

      - name: Verify staging health
        run: |
          RESULT=$(aws ssm send-command \
            --instance-ids "i-0155b67642e886865" \
            --document-name "AWS-RunShellScript" \
            --region ${{ env.AWS_REGION }} \
            --parameters 'commands=["curl -sf http://localhost:4000/api/v1/healthcheck && echo HEALTHY || echo UNHEALTHY"]' \
            --output json)
          echo $RESULT

  deploy-production:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: http://10.0.2.186:3000

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bootstrap and deploy to production
        run: |
          aws ssm send-command \
            --instance-ids "i-086c0b8e18eae424a" \
            --document-name "AWS-RunShellScript" \
            --region ${{ env.AWS_REGION }} \
            --timeout-seconds 600 \
            --parameters 'commands=[
              "apt-get update -qq && apt-get install -y docker.io docker-compose-v2 curl jq unzip -qq || true",
              "systemctl enable docker && systemctl start docker || true",
              "curl -s https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip && unzip -o /tmp/awscliv2.zip -d /tmp && /tmp/aws/install --update || true",
              "mkdir -p /opt/arm-task",
              "PREV_TAG=$(grep IMAGE_TAG /opt/arm-task/.env 2>/dev/null | head -1 | cut -d= -f2 || echo none)",
              "echo $PREV_TAG > /opt/arm-task/.prev_tag",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 773802564338.dkr.ecr.ap-south-1.amazonaws.com",
              "cd /opt/arm-task && aws secretsmanager get-secret-value --secret-id arm-task/prod --region ap-south-1 --query SecretString --output text | jq -r \"to_entries | map(\\"\\(.key)=\\(.value)\\") | .[]\" > .env",
              "echo IMAGE_TAG=${{ needs.build.outputs.image_tag }} >> /opt/arm-task/.env",
              "echo ECR_REGISTRY=773802564338.dkr.ecr.ap-south-1.amazonaws.com >> /opt/arm-task/.env",
              "curl -s https://raw.githubusercontent.com/RahulSinha9/Task-Management-App/main/docker-compose.yml -o /opt/arm-task/docker-compose.yml",
              "cd /opt/arm-task && docker compose -f docker-compose.yml pull",
              "cd /opt/arm-task && docker compose -f docker-compose.yml up -d --remove-orphans",
              "sleep 20 && docker compose -f /opt/arm-task/docker-compose.yml ps"
            ]' \
            --output text

      - name: Wait for deployment
        run: sleep 90

      - name: Tag release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `prod-${{ needs.build.outputs.image_tag }}`;
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha
            });
